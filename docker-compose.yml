services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hirematch}
      POSTGRES_USER: ${POSTGRES_USER:-hirematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirematch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-HireMatch}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hirematch}:${POSTGRES_PASSWORD:-hirematch}@db:5432/${POSTGRES_DB:-hirematch}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:8080}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_TOTAL_BUDGET_SECONDS: ${LLM_TOTAL_BUDGET_SECONDS:-90}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hirematch_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MOCK_LLM: ${MOCK_LLM:-false}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_PAGES_PER_DOCUMENT: ${MAX_PAGES_PER_DOCUMENT:-30}
      MAX_JOB_DESCRIPTION_CHARS: ${MAX_JOB_DESCRIPTION_CHARS:-20000}
      MAX_RESUME_TEXT_CHARS: ${MAX_RESUME_TEXT_CHARS:-40000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  postgres_data:
