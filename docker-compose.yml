services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hirematch}
      POSTGRES_USER: ${POSTGRES_USER:-hirematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirematch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-HireMatch}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hirematch}:${POSTGRES_PASSWORD:-hirematch}@db:5432/${POSTGRES_DB:-hirematch}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      MOCK_LLM: ${MOCK_LLM:-true}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_PAGES_PER_DOCUMENT: ${MAX_PAGES_PER_DOCUMENT:-80}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      TEMP_DIR: ${TEMP_DIR:-/app/temp}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - temp_data:/app/temp

volumes:
  postgres_data:
  uploads_data:
  temp_data:
