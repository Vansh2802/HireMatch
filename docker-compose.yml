services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hirematch}
      POSTGRES_USER: ${POSTGRES_USER:-hirematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirematch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-HireMatch}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hirematch}:${POSTGRES_PASSWORD:-hirematch}@db:5432/${POSTGRES_DB:-hirematch}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hirematch_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MOCK_LLM: ${MOCK_LLM:-true}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-10}
      MAX_PAGES_PER_DOCUMENT: ${MAX_PAGES_PER_DOCUMENT:-80}
      MAX_JOB_DESCRIPTION_CHARS: ${MAX_JOB_DESCRIPTION_CHARS:-12000}
      MAX_RESUME_TEXT_CHARS: ${MAX_RESUME_TEXT_CHARS:-12000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      TEMP_DIR: ${TEMP_DIR:-/app/temp}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - temp_data:/app/temp

volumes:
  postgres_data:
  uploads_data:
  temp_data:
