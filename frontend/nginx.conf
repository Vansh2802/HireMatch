# Serves the built SPA and proxies /api to FastAPI on the same origin,
# so session cookies are first-party and the browser never needs CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Upload limit slightly above MAX_UPLOAD_SIZE_MB (multipart overhead).
    client_max_body_size 11m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;  # keep the port: the API compares Origin with Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
